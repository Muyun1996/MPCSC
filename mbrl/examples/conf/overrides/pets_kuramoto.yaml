# @package _group_
env: "gym___gym_dynamics/Kuramoto_dynamics"
term_fn: "no_termination"
reward_fn: "kuramoto"
learned_rewards: false
epistemic_reward_weight: 0
action_cost_reward_weight: 0
is_random_init: true
trial_length: 150
num_steps: 20000
use_node_id: false

params_to_env:
  net_type: 'ER'
  T: 150
  node_num: 50
  driver_node_num: 15
  observe_node_num: 50
  avg_degree: 6
  coupling: 0.6
  noise_std: 0.
  seed: 111111

num_elites: 5
model_lr: 7.5e-4
model_wd: 3e-5
model_batch_size: 128
validation_ratio: 0.2
freq_train_model: 50
patience: 20000
init_num_epochs_train_model: 500
num_epochs_train_model: 20

planning_horizon: 15
cem_num_iters: 5
cem_elite_ratio: 0.1
cem_population_size: 150
cem_alpha: 0.1
cem_clipped_normal: false